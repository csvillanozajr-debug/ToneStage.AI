<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pedal Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="pedal.css" />
  </head>
  <body>
    <div class="pedal overdrive" id="demoPedal">
      <div class="pedal-body">
        <div class="pedal-label">Overdrive</div>
        <div class="pedal-knob knob-1" data-param="Gain" data-value="0.5"></div>
        <div class="pedal-knob knob-2" data-param="Tone" data-value="0.5"></div>
        <div class="pedal-knob knob-3" data-param="Level" data-value="0.5"></div>
        <div class="pedal-led"></div>
        <div class="pedal-footswitch"></div>
      </div>
    </div>

    <script src="pedal-app.js"></script>
  </body>
</html>
